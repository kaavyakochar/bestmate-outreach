<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>BestMate Outreach Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
/* Layout: SaaS app shell. Left sidebar (top strip on phones), page header with the primary action, one view at a time; lead record is a right drawer, import/add is a centered modal. Single bright theme by request. */
:root{
  color-scheme:light;
  --bg:#ffffff; --subtle:#f6f7f9; --line:#e3e6eb; --fg:#101828; --muted:#5b6577;
  --pri:#2356e0; --pri-soft:#e9effd; --on-pri:#ffffff;
  --good:#0f7a55; --good-soft:#e2f5ec; --warn:#a85b06; --warn-soft:#fdf0d9; --bad:#c2302a; --bad-soft:#fde9e7;
  --shade:rgba(16,24,40,.42); --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --font:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
aside.side{background:var(--subtle);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--pri);display:inline-block}
.side button{display:flex;align-items:center;justify-content:space-between;gap:8px;font:400 15px var(--font);color:var(--muted);background:none;border:0;border-radius:6px;padding:9px 10px;cursor:pointer;text-align:left;white-space:nowrap}
.side button:hover{background:var(--line)}
.side button[aria-current="page"]{background:var(--bg);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.cnt{font-size:12px;font-weight:700;background:var(--line);color:var(--muted);border-radius:99px;padding:1px 8px}
.cnt.hot{background:var(--bad);color:var(--on-pri)}
.sample{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:6px;white-space:normal}
main{padding-inline:28px;padding-block:22px 64px;display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.head h1{font-size:24px;margin:0;font-weight:700}
.head .sub{color:var(--muted);font-size:14px}
.head .sp{margin-left:auto}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{font:700 14px var(--font);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)} .btn.pri:hover{filter:brightness(.94)}
.btn.dan{color:var(--bad)} .btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--pri);font:700 14px var(--font);cursor:pointer;padding:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{font:400 13.5px var(--font);background:var(--bg);color:var(--muted);border:0;border-right:1px solid var(--line);padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--pri-soft);color:var(--pri);font-weight:700}
select,input[type=date],input[type=search],input[type=text],input[type=email],input[type=url],input[type=tel],textarea{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%}
input[type=search]{flex:1 1 220px;min-width:180px}
textarea{width:100%;resize:vertical}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg);box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:var(--font);color:var(--fg);display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--pri)}
.kpi .l{font-size:13.5px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:16px;color:var(--muted);font-weight:400}
.kpi .h{font-size:12.5px;color:var(--muted)}
.kpi.urgent{border-color:var(--bad);background:var(--bad-soft)} .kpi.urgent .v{color:var(--bad)}
.kpi.good .v{color:var(--good)} .kpi.pending .v{color:var(--warn)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--good)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.flow button{background:var(--bg);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;padding:12px 14px;text-align:left;font-family:var(--font);color:var(--fg);cursor:pointer}
.flow button:hover{background:var(--subtle)}
.flow .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.flow .l{font-size:13px;color:var(--muted)}
h2{font-size:17px;margin:0;font-weight:700}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--bg);box-shadow:var(--shadow);min-width:0}
.panel.pad{padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;font-weight:700;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--subtle)}
th button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody.click tr{cursor:pointer} tbody.click tr:hover td{background:var(--subtle)}
tr.sel td{background:var(--pri-soft)}
.num{font-variant-numeric:tabular-nums}
.sub2{color:var(--muted);font-size:12.5px}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-hir{background:var(--bad);color:var(--on-pri)} .s-good{background:var(--good-soft);color:var(--good)} .s-info{background:var(--pri-soft);color:var(--pri)}
.s-warn{background:var(--warn-soft);color:var(--warn)} .s-mute{background:var(--subtle);color:var(--muted);border:1px solid var(--line)} .s-bad{background:var(--bad-soft);color:var(--bad)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--pri-soft);border:1px solid var(--pri);border-radius:8px;padding:8px 12px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;color:var(--muted);font-size:13.5px;padding:10px 12px;border-top:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);background:var(--bg);min-width:0}
.card.hir{border-left:4px solid var(--bad)}
.card .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.card .hd b{font-size:16px}
.quote{background:var(--subtle);border-radius:6px;padding:10px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{color:var(--muted);padding:34px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--subtle)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.funnel{display:grid;grid-template-columns:140px 1fr 60px;gap:8px 12px;align-items:center}
.funnel .b{height:18px;background:var(--pri);border-radius:3px;min-width:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--subtle);border-left:1px solid var(--line);z-index:21;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 48px;display:flex;flex-direction:column;gap:14px}
.drawer h2{font-size:22px}
.sec{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.sec h3{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.sec ul{margin:0;padding-left:18px}
.sec.alert{border-color:var(--bad)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)} .kv span{overflow-wrap:anywhere}
.tl .e{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tl .e:last-child{border-bottom:0}
.tl .t{font-size:12.5px;color:var(--muted)}
.tl .e.future{opacity:.6}
.msg{white-space:pre-wrap;font-size:14px;background:var(--subtle);border-radius:6px;padding:10px 12px;margin-top:6px}
details summary{cursor:pointer;color:var(--pri);font-size:13.5px;font-weight:700}
.modal{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal .box{background:var(--bg);border-radius:12px;width:min(880px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:26;box-shadow:0 12px 40px rgba(16,24,40,.25)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.form label,.map label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700}
.form label.wide{grid-column:1/-1}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;background:var(--subtle);display:flex;flex-direction:column;gap:10px;align-items:center}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.steps b{color:var(--pri)}
.err{color:var(--bad);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:700;z-index:40;max-width:90%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri)}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;align-items:center}
  .brand{padding:0 8px 0 0} .brand span,.sample{display:none}
  main{padding-inline:16px}
  .funnel{grid-template-columns:104px 1fr 48px}
}

/* v4: flatter, denser, fewer containers; blue only on actions */
:root{--shadow:none;--bar:#475467}
body{font-size:14px}
.btn{border-radius:5px;box-shadow:none}
.panel,.sec{border-radius:6px;box-shadow:none}
.card{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:12px 0}
.list{gap:8px}
.side button[aria-current="page"]{background:var(--line);box-shadow:none}
.brand{font-size:13.5px;letter-spacing:.09em}
.brand i{width:14px;height:14px;border-radius:3px}
.grp{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.cnt,.cnt.hot{background:none;padding:0;font-weight:400;font-size:13px;font-variant-numeric:tabular-nums}
.cnt.hot{color:var(--bad);font-weight:700}
.sample{border:0;font-size:12px}
.seg{border:0;gap:2px;border-radius:0}
.seg button{border:0;border-radius:5px;padding:5px 10px}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--fg)}
.pill,.pill.s-hir,.pill.s-good,.pill.s-info,.pill.s-warn,.pill.s-mute,.pill.s-bad{padding:0;background:none;border:0;border-radius:0;font-weight:600;margin-right:6px}
.pill.s-hir{color:var(--bad)} .pill.s-info{color:var(--fg)} .pill.s-mute{font-weight:400}
.bulk{background:var(--subtle);border-color:var(--line);border-radius:6px}
tr.sel td{background:var(--subtle)}
.funnel .b{background:var(--bar)}
th{background:none;font-weight:600} td,th{padding:8px 10px}
.kpi,.kpi:hover{border:0;box-shadow:none;padding:0;background:none;border-radius:0} .kpi .v{font-size:22px}
.hero{gap:20px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drawer h2,.modal h2{text-transform:none;letter-spacing:0;color:var(--fg)}
.head h1{font-size:21px}
.today{display:grid;grid-template-columns:1.5fr 1fr;gap:8px 48px;padding:4px 0 20px;border-bottom:1px solid var(--line);max-width:760px}
.today .col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stat{background:none;border:0;padding:0;text-align:left;font-family:var(--font);color:var(--fg);cursor:pointer;display:flex;flex-direction:column}
.stat:hover .cap{text-decoration:underline}
.stat .big{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .big small{font-size:22px;color:var(--muted);font-weight:500;letter-spacing:0}
.stat .mid{font-size:22px;font-weight:700;line-height:1.1}
.stat .cap{font-size:14px;color:var(--muted)} .stat .cap b{color:var(--fg)}
.stat.hot .big{color:var(--bad)}
.sh{display:flex;justify-content:space-between;align-items:baseline;max-width:760px}
.rows{display:flex;flex-direction:column;max-width:760px}
.nrow{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nrow:hover .co{text-decoration:underline}
.nrow .co{font-size:15px}
.meta{color:var(--muted);font-size:13px}
.nrow .q{margin-top:3px}
.side2{display:flex;flex-direction:column;align-items:flex-end;gap:6px;white-space:nowrap}
.link.quiet{color:var(--muted);font-weight:400;font-size:13px}
.pipe{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;color:var(--muted)}
.pipe button{background:none;border:0;padding:0;font:400 14px var(--font);color:var(--muted);cursor:pointer}
.pipe button b{color:var(--fg);font-variant-numeric:tabular-nums}
.pipe button:hover{text-decoration:underline}
.mini{max-width:380px}
.mini td:not(:first-child),.mini th:not(:first-child){text-align:right}
@media (max-width:820px){.grp{display:none}.today{grid-template-columns:1fr 1fr;gap:8px 20px}.stat .big{font-size:36px}}

/* v5: metrics strip + two-column overview */
main{gap:14px}
.head{gap:16px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip button{background:var(--bg);border:0;border-right:1px solid var(--line);padding:10px 14px;text-align:left;font-family:var(--font);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.strip button:last-child{border-right:0}
.strip button:hover{background:var(--subtle)}
.strip .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.strip .v small{font-size:14px;color:var(--muted);font-weight:500}
.strip .l{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:14px;align-items:start}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.box .sh,.box .rows{max-width:none}
.box .sh{margin-bottom:6px}
.queue .nrow:last-child{border-bottom:0;padding-bottom:4px}
.queue .nrow{padding:11px 0}
h2 .urgent{color:var(--bad)}
.kvl div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.kvl div:last-child{border-bottom:0}
.kvl b{color:var(--fg)}
.pipe{gap:6px 8px;line-height:1.5}
.pipe button.urgent,.pipe button.urgent b{color:var(--bad)}
.src td:not(:first-child),.src ~ * td{text-align:left}
.panel{border-radius:8px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip button{border-bottom:1px solid var(--line)}}

/* v6: colour carries meaning; distinct component per section */
:root{--bar2:#a9b4c2;--pri-tint:#f3f6fe}
.brand img{border-radius:6px;display:block}
.brand{gap:9px}
.mets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.met{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px 11px;text-align:left;font-family:var(--font);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.met:hover{border-color:var(--bar2)}
.met .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.met .v small{font-size:14px;color:var(--muted);font-weight:500}
.met .l{font-size:12.5px;color:var(--muted)}
.met .prog{margin-top:7px;height:4px}
.met.good .v{color:var(--good)} .met.warn .v{color:var(--warn)} .met.pri .v{color:var(--pri)}
.met.warn{background:var(--warn-soft);border-color:transparent}
.cols{grid-template-columns:minmax(0,1.85fr) minmax(280px,1fr);gap:16px}
.queue{border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgba(16,24,40,.07);min-width:0;overflow:hidden}
.queue .sh{max-width:none;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--subtle);margin:0}
.queue .sh h2{color:var(--fg)}
.queue .rows{max-width:none}
.queue .nrow{padding:14px 16px;border-left:3px solid transparent}
.queue .nrow:hover{background:var(--pri-tint)}
.queue .nrow:last-child{border-bottom:0;padding-bottom:14px}
.queue .nrow:first-child.k-objection{border-left-color:var(--bad)} .queue .nrow:first-child.k-interested{border-left-color:var(--good)}
.queue .nrow:first-child.k-question{border-left-color:var(--pri)} .queue .nrow:first-child.k-pricing{border-left-color:var(--warn)}
.nrow .co{font-size:15.5px}
.nrow .q{font-size:14.5px;margin-top:4px}
.tg{font-weight:700}
.k-objection .tg{color:var(--bad)} .k-interested .tg{color:var(--good)} .k-question .tg{color:var(--pri)} .k-pricing .tg{color:var(--warn)}
.nrow .side2 .link:first-child{border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--bg)}
.nrow .side2 .link:first-child:hover{border-color:var(--pri)}
.today2{background:var(--subtle);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tgt{display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.tgt b{color:var(--fg);font-size:18px;margin-right:4px}
.tgt .ok{float:right;color:var(--good);font-weight:700;font-size:12.5px;margin-top:5px}
.tgt .prog{height:6px;background:var(--line)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.tgrid div{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:13.5px;min-width:0}
.tgrid b{color:var(--fg);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bar2);display:inline-block;flex:none;transform:translateY(-1px)}
.dot.warn{background:var(--warn)} .dot.pri{background:var(--pri)} .dot.good{background:var(--good)}
.fun{display:flex;flex-direction:column;gap:2px}
.fun button{display:grid;grid-template-columns:112px minmax(0,1fr) 46px;gap:10px;align-items:center;background:none;border:0;border-radius:6px;padding:5px 6px;margin:0 -6px;font:400 13.5px var(--font);color:var(--muted);cursor:pointer;text-align:left}
.fun button:hover{background:var(--subtle)}
.fun b{color:var(--fg);text-align:right}
.fb{height:10px;background:var(--subtle);border-radius:3px;overflow:hidden}

  else if(a==='send'){const v=$('#draft').value.trim();if(!v)return;p.reply.handled=true;p.log.push({t,h:'Reply sent by '+(p.owner==='Unassigned'?'a person':p.owner),quote:v});toast('Reply logged. Sending goes live when the mailbox is connected.')}
  else if(a==='handled'){p.reply.handled=true;p.log.push({t,h:'Handled outside the dashboard. Automation stays off.'});toast('Marked as replied')}
  else if(a==='notint'){p.override='Not interested';stop();p.log.push({t,h:'Marked not interested. Added to the do-not-contact list.'});toast('Added to do-not-contact list')}
  else if(a==='dq'){p.override='Disqualified';stop();p.log.push({t,h:'Disqualified by a person'});toast('Disqualified')}
  else if(a==='pause'){p.paused=!p.paused;p.log.push({t,h:p.paused?'Sequence paused':'Sequence resumed'});toast(p.paused?'Sequence paused':'Sequence resumed')}
  else if(a==='sim'){const ty=$('#simType').value;if(!p.steps.some(x=>x.kind==='email'&&x.done))p.steps=[{t:t-36e5,kind:'email',n:1,done:true}];else stop();p.slot=true;if(p.owner==='Unassigned')p.owner='Tarush';p.reply={t,type:ty,text:pick(REPLY[ty][0]),positive:REPLY[ty][1],handled:false,demo:true};p.log.push({t:t+1,h:'Demo: reply simulated'});toast('Reply simulated. See Needs you.')}
  else if(a==='snooze'){p.snoozed=true;p.log.push({t,h:'Snoozed until tomorrow'});toast('Snoozed until tomorrow')}
  else if(a==='seq'){toast(addToSeq(p)?'Added to sequence':'Needs an email address first')}
  else if(a==='task'||a==='skip'){const s=p.steps.find(s=>s.t===+b.dataset.t);s.done=true;s.skipped=a==='skip';s.t=Math.min(s.t,t);toast(a==='task'?'Logged':'Skipped')}
  else if(a==='note'){const v=$('#note').value.trim();if(!v)return;p.log.push({t,h:'Note: '+v});toast('Note added')}
  if(p&&p.remote){ if(a==='handled'||a==='send')p.override='Replied'; if(a==='seq')p.override='Ready to contact'; if(['meeting','notint','dq','handled','send','note','seq'].includes(a)) syncLead(p,a); }
  render(); }); }

/* ================= import / add leads ================= */
const FIELDS=[['company','Company name'],['contact','Contact name'],['title','Job title'],['email','Email'],['phone','Phone'],['linkedin','LinkedIn URL'],['website','Website'],['location','Location'],['industry','Industry'],['notes','Notes'],['source','Lead source'],['tags','Tags']];
const GUESS={company:/company|business|account|organi[sz]ation/i,contact:/contact|^name$|full.?name|owner|first.?name/i,title:/title|role|position/i,email:/e-?mail/i,phone:/phone|mobile|tel/i,linkedin:/linkedin/i,website:/web|url|domain|site/i,location:/location|city|address/i,industry:/industry|trade|category|service/i,notes:/note|comment/i,source:/source/i,tags:/tag/i};
const SAMPLE_CSV=`Company Name,Contact Name,Job Title,Email,Phone,LinkedIn URL,Website,City,Industry,Notes,Crew Size
Palmetto Comfort Air,Renee Albright,Owner,renee@palmettocomfort.example,(555) 0142,linkedin.com/in/example-renee,palmettocomfort.example,"Charlotte, NC",HVAC,Met at the home show,12
Twin Rivers Plumbing,Hank Doyle,Owner,hank@twinrivers.example,(555) 0177,,twinrivers.example,"Houston, TX",Plumbing,,9
${P[3].company},${P[3].contact},Owner,${P[3].email},,,,"${P[3].city}, ${P[3].state}",${P[3].industry},Already in the system,
Gulfside Electric,Mara Quinn,General manager,mara-at-gulfside,(555) 0119,,gulfside.example,"Tampa, FL",Electrical,Email looks wrong,14
,Joe Park,Owner,joe@noname.example,,,,"Austin, TX",Roofing,No company name,
Red Mesa Roofing,Cal Ortiz,Owner,,,,,"Tucson, AZ",Roofing,No contact details at all,11
Twin Rivers Plumbing,Hank Doyle,Owner,hank@twinrivers.example,,,,"Houston, TX",Plumbing,Same lead twice in this file,
Lakeshore Garage Doors,Priya Nair,Operations manager,priya@lakeshoredoors.example,(555) 0163,,lakeshoredoors.example,"Orlando, FL",Garage doors,Referred by a customer,8`;
let M=null;
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true; else if(ch===','){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
  else c+=ch}
  r.push(c); if(r.some(x=>x.trim()))rows.push(r); return rows}
function openModal(){ M={tab:'import',step:1,err:'',dup:'skip',source:'CSV Import',keep:true,cf:[]}; modal(); }
function loadRows(rows,name){ if(rows.length<2){M.err='That file has no data rows.';return modal()}
  M.headers=rows[0].map(h=>String(h).trim()); M.rows=rows.slice(1).map(r=>r.map(c=>String(c==null?'':c).trim())); M.file=name; M.err='';
  M.map={}; const used=new Set(); ['company','linkedin','email','phone','title','contact','website','location','industry','notes','source','tags'].forEach(f=>{const i=M.headers.findIndex((h,j)=>!used.has(j)&&GUESS[f].test(h)); if(i>=0){M.map[f]=i;used.add(i)}});
  M.step=2; modal(); }
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const domain=u=>norm(String(u||'').replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]);
function splitLoc(l){const m=String(l||'').match(/^(.*?),\s*([A-Za-z]{2})\b/);return m?{city:m[1].trim(),state:m[2].toUpperCase()}:{city:String(l||'').trim(),state:''}}
function findDup(d,extra){ const loc=splitLoc(d.location), ck=norm(d.company)+'|'+norm(loc.city);
  const hit=p=>(d.email&&p.email&&p.email.toLowerCase()===d.email.toLowerCase())||(d.linkedin&&p.linkedin&&norm(p.linkedin)===norm(d.linkedin))||(d.website&&p.website&&domain(p.website)===domain(d.website))||(d.company&&norm(p.company)+'|'+norm(p.city)===ck);
  return P.find(hit)||(extra||[]).find(hit); }
function analyse(){ const seen=[]; M.out=M.rows.map(r=>{ const d={}; FIELDS.forEach(([f])=>d[f]=M.map[f]!=null&&M.map[f]!==''?r[M.map[f]]||'':'');
    d.custom={}; if(M.keep) M.headers.forEach((h,i)=>{if(!Object.values(M.map).includes(i)&&r[i])d.custom[h]=r[i]});
    const flags=[]; let action='import';
    if(!d.company){flags.push(['Missing company','s-bad']);action='invalid'}
    if(d.email&&!validEmail(d.email)){flags.push(['Invalid email','s-bad']);d.email=''}
    if(action!=='invalid'&&!d.email&&!d.phone&&!d.linkedin)flags.push(['No way to contact','s-warn']); else if(action!=='invalid'&&!d.email)flags.push(['No email','s-warn']);
    if(action!=='invalid'){ const loc=splitLoc(d.location), self={company:d.company,city:loc.city,email:d.email,linkedin:d.linkedin,website:d.website};
      const ex=findDup(d); const inFile=!ex&&findDup(d,seen)&&!P.includes(findDup(d,seen));
      if(ex){flags.push(['Duplicate of existing lead','s-info']);action=M.dup;d._ex=ex}
      else if(inFile){flags.push(['Repeated in this file','s-info']);action='skip'}
      else seen.push(self); }
    return {d,flags,action}; }); }
function makeLead(d,source){ const loc=splitLoc(d.location);
  return {id:nextId++,company:d.company,industry:d.industry||'',city:loc.city,state:loc.state,contact:d.contact||'',title:d.title||'',email:d.email||'',phone:d.phone||'',linkedin:d.linkedin||'',website:d.website||'',
    source:SOURCES.includes(d.source)?d.source:source,owner:'Unassigned',tags:String(d.tags||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean),custom:d.custom||{},seg:'—',fit:null,sigPts:null,score:null,tier:'Unscored',signal:'',added:Date.now(),
    found:[],steps:[],log:d.notes?[{t:Date.now()+1,h:'Note: '+d.notes}]:[],reply:null,meeting:null,paused:false,slot:false,dq:null}; }
function applyTo(ex,d,mode){ ['contact','title','email','phone','linkedin','website','industry'].forEach(k=>{if(d[k]&&(mode==='update'||!ex[k]))ex[k]=d[k]});
  const loc=splitLoc(d.location); if(loc.city&&(mode==='update'||!ex.city)){ex.city=loc.city;ex.state=loc.state||ex.state}
  Object.assign(ex.custom,mode==='update'?d.custom:{...d.custom,...ex.custom}); ex.log.push({t:Date.now(),h:(mode==='update'?'Updated':'Merged')+' from import'+(M.file?' · '+M.file:'')}); }
function modal(){ const el=$('#modal'); if(!M){el.innerHTML='';return}
  let body='';
  if(M.tab==='import'){
    if(M.step===1) body=`<div class="drop"><b>Upload a CSV or Excel file</b><span class="muted">First row should be column headers. You'll map the columns next.</span><input type="file" id="file" accept=".csv,.xlsx,.xls" aria-label="Choose file"><button class="link" id="useSample">No file handy? Try a sample file</button></div>${M.err?`<div class="err">${esc(M.err)}</div>`:''}`;
    else if(M.step===2) body=`<div class="muted">${esc(M.file)} · ${M.rows.length} rows. Match your columns to the lead fields. Company name is required.</div>
      <div class="map">${FIELDS.map(([f,l])=>`<label>${l}${f==='company'?' *':''}<select data-map="${f}">${opts(M.headers.map((h,i)=>[String(i),h]),M.map[f]!=null?String(M.map[f]):'','Not in file')}</select></label>`).join('')}</div>
      <label class="row"><input type="checkbox" id="keep" ${M.keep?'checked':''}> Keep unmapped columns as custom fields</label>
      <label class="row" style="font-weight:700">Lead source for this import <select id="msrc">${opts(SOURCES.filter(s=>s!=='Discovered by BestMate'),M.source)}</select></label>
      ${M.err?`<div class="err">${esc(M.err)}</div>`:''}
      <div class="row" style="justify-content:flex-end"><button class="btn" id="back">Back</button><button class="btn pri" id="toPrev">Preview import</button></div>`;
    else { analyse(); const c=a=>M.out.filter(o=>o.action===a).length, nImp=c('import'), nDup=M.out.filter(o=>o.d._ex).length;
      body=`<div class="row"><span class="pill s-good">${nImp} new</span><span class="pill s-info">${nDup} duplicates</span><span class="pill s-bad">${c('invalid')} can't be imported</span><span class="pill s-warn">${M.out.filter(o=>o.flags.some(f=>f[1]==='s-warn')).length} with warnings</span></div>
      <div class="row"><b>Duplicates of existing leads:</b><div class="seg">${[['skip','Skip'],['merge','Merge (fill blanks)'],['update','Update (overwrite)']].map(([k,l])=>`<button data-dup="${k}" aria-pressed="${M.dup===k}">${l}</button>`).join('')}</div></div>
      <div class="panel scroll" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>Row</th><th>Company</th><th>Contact</th><th>Email</th><th>Location</th><th>Checks</th><th>Result</th></tr></thead><tbody>${M.out.slice(0,100).map((o,i)=>`<tr><td class="num">${i+2}</td><td><b>${esc(o.d.company||'—')}</b></td><td>${esc(o.d.contact||'—')}</td><td>${esc(o.d.email||'—')}</td><td>${esc(o.d.location||'—')}</td><td>${o.flags.map(f=>`<span class="pill ${f[1]}">${f[0]}</span>`).join(' ')||'<span class="pill s-good">OK</span>'}</td><td>${{import:'Import',skip:'Skip',merge:'Merge',update:'Update',invalid:'Not imported'}[o.action]}</td></tr>`).join('')}</tbody></table></div>
      ${M.out.length>100?`<div class="muted small">Showing the first 100 of ${M.out.length} rows.</div>`:''}
      <div class="muted small">Imported leads join the same workflow as discovered ones: enrich, qualify, research, personalize, sequence.</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="back">Back</button><button class="btn pri" id="confirm" ${nImp+(M.dup==='skip'?0:nDup)?'':'disabled'}>Import ${nImp} lead${nImp===1?'':'s'}${M.dup!=='skip'&&nDup?` and ${M.dup} ${nDup}`:''}</button></div>`; }
  } else body=`<form id="addForm" class="list" novalidate><div class="form">
      <label>Company name *<input type="text" id="a-company"></label><label>Contact name<input type="text" id="a-contact"></label>
      <label>Job title<input type="text" id="a-title"></label><label>Email<input type="email" id="a-email"></label>
      <label>Phone<input type="tel" id="a-phone"></label><label>LinkedIn URL<input type="url" id="a-linkedin"></label>
      <label>Website<input type="text" id="a-website"></label><label>Location<input type="text" id="a-location" placeholder="City, ST"></label>
      <label>Industry<input type="text" id="a-industry"></label><label>Lead source<select id="a-source">${opts(SOURCES.filter(s=>s!=='Discovered by BestMate'&&s!=='CSV Import'),'Manually Added')}</select></label>
      <label>Tags<input type="text" id="a-tags" placeholder="Comma separated"></label>
      <label class="wide">Notes<textarea id="a-notes" rows="2"></textarea></label></div>
      <div class="list" style="gap:8px"><b style="font-size:13.5px">Custom fields</b>${M.cf.map((c,i)=>`<div class="row"><input type="text" data-cfk="${i}" placeholder="Field name" value="${esc(c[0])}" aria-label="Custom field name"><input type="text" data-cfv="${i}" placeholder="Value" value="${esc(c[1])}" aria-label="Custom field value"></div>`).join('')}<div><button type="button" class="link" id="addCf">+ Add custom field</button></div></div>
      ${M.err?`<div class="err">${M.err}</div>`:''}
      <div class="row" style="justify-content:flex-end"><label class="row" style="margin-right:auto"><input type="checkbox" id="a-seq"> Add to outreach sequence now</label><button type="submit" class="btn pri">Add lead</button></div></form>`;
  el.innerHTML=`<div class="modal"><div class="shade" id="mshade"></div><div class="box" role="dialog" aria-label="Import or add leads">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">Import / add leads</h2><button class="btn sm" id="mclose">Close</button></div>
    <div class="seg" style="align-self:flex-start"><button data-tab="import" aria-pressed="${M.tab==='import'}">Import file</button><button data-tab="manual" aria-pressed="${M.tab==='manual'}">Add manually</button></div>
    ${M.tab==='import'?`<div class="steps">${['Upload','Map columns','Preview and confirm'].map((s,i)=>M.step===i+1?`<b>${i+1}. ${s}</b>`:`<span>${i+1}. ${s}</span>`).join('<span>›</span>')}</div>`:''}
    ${body}</div></div>`;
  const close=()=>{M=null;modal()}; $('#mclose').onclick=$('#mshade').onclick=close;
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{keepForm();M.tab=b.dataset.tab;M.err='';modal();restoreForm()});
  if($('#file')) $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    if(/\.csv$/i.test(f.name)){rd.onload=()=>loadRows(parseCSV(String(rd.result)),f.name);rd.readAsText(f)}
    else{ if(typeof XLSX==='undefined'){M.err='Excel reading is unavailable right now. Save the sheet as CSV and upload that.';return modal()}
      rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});loadRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim())),f.name)}catch(x){M.err='Could not read that file. Check it is a valid .xlsx or .csv.';modal()}};rd.readAsArrayBuffer(f)} };
  if($('#useSample')) $('#useSample').onclick=()=>loadRows(parseCSV(SAMPLE_CSV),'sample-leads.csv');
  el.querySelectorAll('[data-map]').forEach(s=>s.onchange=()=>{M.map[s.dataset.map]=s.value===''?null:+s.value});
  if($('#keep')) $('#keep').onchange=e=>M.keep=e.target.checked; if($('#msrc')) $('#msrc').onchange=e=>M.source=e.target.value;
  if($('#back')) $('#back').onclick=()=>{M.step--;M.err='';modal()};
  if($('#toPrev')) $('#toPrev').onclick=()=>{if(M.map.company==null){M.err='Choose which column holds the company name.';return modal()}M.err='';M.step=3;modal()};
  el.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{M.dup=b.dataset.dup;modal()});
  if($('#confirm')) $('#confirm').onclick=()=>{let n=0,u=0;M.out.forEach(o=>{if(o.action==='import'){const l=makeLead(o.d,M.source);l.log.unshift({t:Date.now(),h:'Imported from '+M.file});addLead(l);n++}else if(o.action==='merge'||o.action==='update'){applyTo(o.d._ex,o.d,o.action);u++}});
    const src=M.source;M=null;modal();toast(`${n} imported`+(u?`, ${u} existing updated`:''));S.sort={k:'default',d:-1};go('leads',{source:src})};
  if($('#addCf')) $('#addCf').onclick=()=>{keepForm();M.cf.push(['','']);modal();restoreForm()};
  if($('#addForm')) $('#addForm').onsubmit=e=>{e.preventDefault();keepForm();const d={...M.form};d.custom={};M.cf.forEach(([k,v])=>{if(k.trim()&&v.trim())d.custom[k.trim()]=v.trim()});
    if(!d.company){M.err='Company name is required.';modal();return restoreForm()}
    if(d.email&&!validEmail(d.email)){M.err='That email address does not look right.';modal();return restoreForm()}
    const ex=findDup(d); if(ex&&!M.force){M.force=true;M.err=`${esc(ex.company)}${ex.city?' in '+esc(ex.city):''} is already in the system (${esc(status(ex))}). Press Add lead again to add it anyway.`;modal();return restoreForm()}
    const l=makeLead(d,d.source);l.source=d.source;addLead(l);const seq=M.seq&&addToSeq(l);M=null;modal();toast(seq?'Lead added and sequenced':'Lead added');S.sort={k:'default',d:-1};go('leads',{source:l.source});S.open=l.id;drawer()};
}
const AF=['company','contact','title','email','phone','linkedin','website','location','industry','source','tags','notes'];
function keepForm(){ if(!$('#addForm'))return; M.form={}; AF.forEach(k=>M.form[k]=$('#a-'+k).value.trim()); M.seq=$('#a-seq').checked;
  document.querySelectorAll('[data-cfk]').forEach(i=>M.cf[+i.dataset.cfk][0]=i.value); document.querySelectorAll('[data-cfv]').forEach(i=>M.cf[+i.dataset.cfv][1]=i.value); }
function restoreForm(){ if(!$('#addForm')||!M.form)return; AF.forEach(k=>{if(M.form[k]!=null)$('#a-'+k).value=M.form[k]}); $('#a-seq').checked=!!M.seq; }
render();
